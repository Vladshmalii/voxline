[project]
name = "voxline-backend"
version = "0.1.0"
# Capped at the Dockerfile's 3.13 base: pipecat-ai>=1.8 requires pydantic>=2.13
# on Python 3.14+, which an uncapped range forces uv to resolve against the
# pydantic==2.12.5 pin below even though no deployment runs 3.14.
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.135.1",
    "starlette==0.52.1",
    "uvicorn[standard]==0.42.0",
    "gunicorn==25.3.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "sqlalchemy==2.0.48",
    "asyncpg==0.31.0",
    "psycopg2-binary",
    "alembic==1.18.4",
    "loguru==0.7.3",
    "python-dotenv==1.2.2",
    "mako==1.3.10",
    "redis>=5",
    "orjson>=3.10",
    "PyJWT>=2.9",
    "argon2-cffi>=23.1",
    "httpx>=0.28.1",
    "websockets>=16.0",
    "greenlet>=3.5.0",
    "pipecat-ai[silero,websocket,deepgram]==1.8.1",
    "taskiq>=0.12.6",
    "python-multipart>=0.0.32",
    "jinja2>=3.1.6",
    "cartesia>=4.2.0",
    "taskiq-redis>=1.2.3",
    "xlsxwriter>=3.2.9",
]

[tool.pytest.ini_options]
# The engine's tests are async throughout: aggregators, frame processors and
# turn strategies are all coroutines. The API tests share one event loop per
# session because SessionMaker caches asyncpg engines, and an engine outliving
# its loop is a hard error.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Two suites, two interpreters (see tests/*/conftest.py guards):
#   .venv           runs tests/api    (postgres + redis; engine suite skips)
#   research/.venv  runs tests/engine (pipecat; api suite skips)
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.5",
]

[tool.ruff.lint]
ignore = [
    # DB datetime columns are naive (no timezone=True) throughout; datetime.now()
    # without tz matches that convention. Adding tz-aware datetimes would raise
    # TypeError against naive values read back from the DB.
    "DTZ",
    # Query(...)/File(...) as parameter defaults is the FastAPI-idiomatic way to
    # declare query params and file uploads, not a mutable-default hazard.
    "B008",
]
