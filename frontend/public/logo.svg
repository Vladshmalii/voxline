<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="allo-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="allo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="18" fill="#050711"/>
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="url(#allo-grad)" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <!-- Stylized "A" + Phone Receiver + Waveform -->
  <g filter="url(#allo-glow)">
    <path d="M16 48L32 14L48 48" stroke="url(#allo-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 36H42" stroke="#00F2FE" stroke-width="4" stroke-linecap="round"/>
    <circle cx="48" cy="18" r="4" fill="#00F2FE"/>
  </g>
</svg>
