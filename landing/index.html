<!doctype html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Allo AI (Алло.ai) — Голосові ШІ-агенти реального часу для бізнесу</title>
  <meta name="description" content="Автономний голосовий ШІ-оператор Allo AI: приймає та здійснює дзвінки із затримкою 240 мс, кваліфікує ліди, пише в CRM і надсилає SMS. 24/7, без черг." />
  <meta name="theme-color" content="#050711" />
  <meta property="og:title" content="Allo AI — голосовий ШІ, який не спить і не зливає ліди" />
  <meta property="og:description" content="Відповідь за 240 мс, живе перебивання, CRM і SMS після розмови. Замовте демо-дзвінок." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="pages.css" />
  <script>try{var t=localStorage.getItem("allo-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f7fb; --bg-2: #eceef6; --surface: #ffffff; --surface-2: #f1f3f9;
      --line: #dfe3ee; --text: #0b1020; --muted: #4b5470; --dim: #6b7390;
      --violet: #7928ca; --violet-2: #9b4dff; --cyan: #0891b2; --cyan-neon: #00b8d9;
      --ok: #059669; --bad: #dc2626; --amber: #d97706;
      --glass: rgba(255,255,255,.72); --glow: rgba(121,40,202,.18);
      --grad: linear-gradient(120deg, #7928ca 0%, #3b82f6 55%, #00b8d9 100%);
      --max: 1180px; --r: 18px;
      --sans: 'Plus Jakarta Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
    }
    :root[data-theme='dark'] {
      --bg: #050711; --bg-2: #090d1f; --surface: #0b1129; --surface-2: #10173a;
      --line: #1c2552; --text: #f5f7ff; --muted: #a3adc9; --dim: #7681a6;
      --violet: #8b3dff; --violet-2: #a76bff; --cyan: #00f2fe; --cyan-neon: #00f2fe;
      --ok: #10b981; --bad: #ff5470; --amber: #f59e0b;
      --glass: rgba(11,17,41,.7); --glow: rgba(139,61,255,.35);
      --grad: linear-gradient(120deg, #a76bff 0%, #5b8cff 50%, #00f2fe 100%);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 88px; }
    body { font-family: var(--sans); font-size: 16px; line-height: 1.6; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    body.modal-open { overflow: hidden; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--cyan-neon); outline-offset: 3px; border-radius: 6px; }
    .wrap { width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 24px; }
    .mono { font-family: var(--mono); }
    .grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    /* ambient background */
    .aurora { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .aurora i { position: absolute; border-radius: 50%; filter: blur(120px); opacity: .32; }
    .aurora i:nth-child(1) { width: 560px; height: 560px; left: -140px; top: -120px; background: var(--violet); animation: drift 22s ease-in-out infinite alternate; }
    .aurora i:nth-child(2) { width: 480px; height: 480px; right: -120px; top: 12vh; background: #00a7c4; opacity: .2; animation: drift 28s ease-in-out infinite alternate-reverse; }
    :root:not([data-theme='dark']) .aurora i { opacity: .16; }
    .grid-bg { position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 56px 56px; opacity: .35; mask-image: radial-gradient(ellipse 70% 55% at 50% 0%, #000 30%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 0%, #000 30%, transparent 75%); }
    @keyframes drift { to { transform: translate(90px, 70px) scale(1.15); } }

    /* header */
    header.top { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); background: color-mix(in srgb, var(--bg) 72%, transparent); border-bottom: 1px solid transparent; transition: border-color .25s; }
    header.top.scrolled { border-bottom-color: var(--line); }
    .nav { height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -.02em; }
    .brand img { width: 30px; height: 30px; }
    .links { display: flex; gap: 26px; font-size: 14px; font-weight: 600; color: var(--muted); }
    .links a { transition: color .2s; } .links a:hover { color: var(--text); }
    .tools { display: flex; align-items: center; gap: 10px; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--surface); }
    .seg button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; font-size: 12px; font-weight: 700; color: var(--dim); }
    .seg button[aria-pressed='true'] { background: var(--violet); color: #fff; }
    .icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .icon-btn svg { width: 18px; height: 18px; }

    /* buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 12px; padding: 14px 24px; font-weight: 700; font-size: 15px; transition: transform .2s, box-shadow .2s, background .2s; white-space: nowrap; }
    .btn-sm { padding: 9px 16px; font-size: 13.5px; border-radius: 10px; }
    .btn-primary { background: linear-gradient(120deg, #7928ca, #4f6bff); color: #fff; box-shadow: 0 8px 28px -8px var(--glow), inset 0 1px 0 rgba(255,255,255,.25); position: relative; overflow: hidden; }
    .btn-primary::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); transform: translateX(-120%); transition: transform .7s; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 34px -8px var(--glow); }
    .btn-primary:hover::after { transform: translateX(120%); }
    .btn-ghost { background: var(--surface); border-color: var(--line); }
    .btn-ghost:hover { border-color: var(--violet-2); transform: translateY(-2px); }
    .btn-block { width: 100%; }
    .btn[disabled] { opacity: .65; cursor: progress; transform: none; }

    /* hero */
    .hero { padding: 72px 0 40px; position: relative; }
    .hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 56px; align-items: center; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); font: 600 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: ping 1.8s infinite; }
    @keyframes ping { 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
    h1.hero-title { font-size: clamp(36px, 5.6vw, 66px); line-height: 1.04; letter-spacing: -.035em; font-weight: 800; margin: 22px 0 20px; }
    .hero-sub { font-size: 18px; color: var(--muted); max-width: 540px; }
    .cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 30px 0 26px; }
    .proof { display: flex; flex-wrap: wrap; gap: 10px 22px; font-size: 13.5px; color: var(--muted); font-weight: 600; }
    .proof span { display: inline-flex; align-items: center; gap: 7px; }
    .proof svg { color: var(--ok); }

    /* call console */
    .console { position: relative; border-radius: 24px; padding: 1px; background: linear-gradient(150deg, var(--violet), transparent 40%, var(--cyan-neon)); box-shadow: 0 40px 90px -30px var(--glow); }
    .console-in { background: var(--surface); border-radius: 23px; padding: 20px; position: relative; overflow: hidden; }
    .c-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .who { display: flex; gap: 14px; align-items: center; min-width: 0; }
    .who strong { display: block; font-size: 15px; line-height: 1.25; }
    .who small { color: var(--dim); font: 11.5px var(--mono); }
    .avatar { position: relative; width: 46px; height: 46px; border-radius: 15px; background: var(--grad); display: grid; place-items: center; color: #050711; flex: none; }
    .avatar svg { width: 21px; height: 21px; }
    .avatar .ring { position: absolute; inset: -5px; border-radius: 19px; border: 1.5px solid var(--cyan-neon); opacity: 0; animation: ring 2.2s ease-out infinite; }
    @keyframes ring { 0% { opacity: .7; transform: scale(.88); } 100% { opacity: 0; transform: scale(1.22); } }
    .live { display: inline-flex; align-items: center; gap: 8px; font: 600 12px var(--mono); padding: 6px 12px; border-radius: 999px; background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--bad); flex: none; }
    .live .dot { background: var(--bad); box-shadow: 0 0 0 0 var(--bad); }
    .live #timer { color: var(--text); }
    .stage { margin-top: 18px; padding: 14px 14px 10px; border-radius: 16px; background: var(--bg-2); border: 1px solid var(--line); }
    .speaker { display: inline-flex; align-items: center; gap: 8px; font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); transition: color .25s; }
    .speaker i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); transition: background .25s; }
    .speaker.agent { color: var(--violet-2); } .speaker.agent i { background: var(--violet-2); }
    .speaker.caller { color: var(--amber); } .speaker.caller i { background: var(--amber); }
    .meter { display: flex; align-items: center; gap: 3px; height: 58px; margin-top: 8px; }
    .meter span { flex: 1; min-width: 2px; height: 6%; border-radius: 3px; background: var(--line); transition: background .3s; }
    .meter.agent span { background: linear-gradient(to top, var(--violet), var(--cyan-neon)); }
    .meter.caller span { background: linear-gradient(to top, var(--amber), #ffd37a); }
    .tr { height: 196px; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; overflow: hidden; margin-top: 16px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 26%); mask-image: linear-gradient(to bottom, transparent 0, #000 26%); }
    .ln { padding-left: 14px; border-left: 2px solid var(--violet-2); transition: opacity .4s; animation: rise .35s ease both; }
    .ln.cl { border-left-color: var(--amber); }
    .ln.old { opacity: .45; }
    .ln b { display: block; font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 2px; }
    .ln p { font-size: 14px; line-height: 1.5; }
    .ln .w { opacity: 0; transition: opacity .25s; }
    .ln .w.on { opacity: 1; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    .events { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
    .ev { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); font-size: 11.5px; font-weight: 600; line-height: 1.25; color: var(--dim); transition: color .4s, border-color .4s, background .4s; }
    .ev svg { width: 18px; height: 18px; flex: none; padding: 3px; border-radius: 50%; background: var(--surface-2); color: transparent; transition: background .4s, color .4s; }
    .ev.done { color: var(--text); border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); background: color-mix(in srgb, var(--ok) 9%, transparent); }
    .ev.done svg { background: var(--ok); color: #fff; }
    .c-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); font: 12px var(--mono); color: var(--dim); gap: 8px; }
    .lat b { color: var(--cyan-neon); font-weight: 600; }
    @keyframes float { 50% { transform: translateY(-9px); } }

    /* sections */
    section { padding: 92px 0; position: relative; }
    .head { max-width: 720px; margin: 0 auto 52px; text-align: center; }
    .head h2 { font-size: clamp(28px, 4vw, 46px); line-height: 1.1; letter-spacing: -.03em; font-weight: 800; margin: 16px 0 14px; }
    .head p { color: var(--muted); font-size: 17px; }

    /* metrics band */
    .band { padding: 34px 0; border-block: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 60%, transparent); }
    .band-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; text-align: center; }
    .band-num { font: 800 clamp(30px, 4vw, 48px)/1 var(--sans); letter-spacing: -.03em; }
    .band-lbl { color: var(--muted); font-size: 13.5px; margin-top: 8px; }

    /* cards */
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px; position: relative; overflow: hidden; transition: transform .3s, border-color .3s; }
    .card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), var(--glow), transparent 55%); opacity: 0; transition: opacity .3s; pointer-events: none; }
    .card:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--violet) 55%, var(--line)); }
    .card:hover::before { opacity: .55; }
    .card > * { position: relative; }
    .stat-num { font: 800 54px/1 var(--sans); letter-spacing: -.04em; color: var(--bad); margin-bottom: 14px; }
    .card h3 { font-size: 19px; letter-spacing: -.01em; margin-bottom: 8px; }
    .card p { color: var(--muted); font-size: 15px; }

    /* tabs */
    .tabs { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); margin-bottom: 28px; }
    .tab { border: 0; background: none; padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 14px; color: var(--muted); transition: .2s; }
    .tab[aria-selected='true'] { background: var(--violet); color: #fff; box-shadow: 0 8px 20px -8px var(--glow); }
    .case { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 40px; animation: rise .4s ease both; }
    .case h3 { font-size: 26px; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 12px; }
    .case > div > p { color: var(--muted); margin-bottom: 20px; }
    .checks { list-style: none; display: grid; gap: 12px; }
    .checks li { display: flex; gap: 10px; font-size: 15px; font-weight: 500; }
    .checks svg { color: var(--ok); flex: none; margin-top: 4px; }
    .dialog-box { display: flex; flex-direction: column; gap: 10px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }

    /* bento */
    .bento { display: grid; grid-template-columns: repeat(6, 1fr); gap: 20px; }
    .tile { grid-column: span 2; display: flex; flex-direction: column; gap: 6px; min-height: 230px; }
    .tile.w4 { grid-column: span 4; }
    .tile .vis { margin-top: auto; padding-top: 18px; }
    .bars { display: flex; align-items: flex-end; gap: 6px; height: 64px; }
    .bars i { flex: 1; height: 100%; border-radius: 4px 4px 0 0; background: var(--grad); opacity: .85; animation: eq 1.6s ease-in-out infinite alternate; transform-origin: bottom; }
    @keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
    .tz { display: flex; gap: 10px; flex-wrap: wrap; }
    .tz span { font: 600 12px var(--mono); padding: 6px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
    .tz .on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
    .tz .off { color: var(--dim); text-decoration: line-through; }
    .sms { align-self: flex-start; padding: 10px 14px; border-radius: 16px 16px 16px 4px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; max-width: 250px; }
    .sentiment { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { font: 600 11.5px var(--mono); padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); }
    .tag.g { color: var(--ok); } .tag.y { color: var(--amber); } .tag.v { color: var(--violet-2); }

    /* ROI */
    .roi { display: grid; grid-template-columns: 1.1fr .9fr; gap: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 40px; }
    .field { margin-bottom: 26px; }
    .field label { display: flex; justify-content: space-between; font-weight: 700; font-size: 14.5px; margin-bottom: 12px; }
    .field output { font-family: var(--mono); color: var(--violet-2); }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 6px; background: linear-gradient(to right, var(--violet) var(--p, 30%), var(--line) var(--p, 30%)); outline-offset: 6px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid var(--violet); cursor: pointer; }
    input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 4px solid var(--violet); cursor: pointer; }
    .roi-out { border-radius: 20px; padding: 30px; background: linear-gradient(160deg, color-mix(in srgb, var(--violet) 26%, var(--surface)), var(--surface-2)); border: 1px solid color-mix(in srgb, var(--violet) 45%, var(--line)); display: flex; flex-direction: column; justify-content: center; gap: 10px; }
    .roi-big { font: 800 clamp(36px, 5vw, 56px)/1.05 var(--sans); letter-spacing: -.04em; }
    .roi-note { font-size: 12.5px; color: var(--dim); }
    .roi-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); padding-top: 10px; border-top: 1px dashed var(--line); }
    .roi-row b { color: var(--text); font-family: var(--mono); }

    /* steps */
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; counter-reset: s; position: relative; }
    .step { counter-increment: s; }
    .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; animation: rise .35s ease both; }
    .msg b { display: block; font: 600 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 3px; opacity: .7; }
    .msg.ai { background: color-mix(in srgb, var(--violet) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--violet) 40%, transparent); border-bottom-left-radius: 4px; align-self: flex-start; }
    .msg.cl { background: var(--surface-2); border: 1px solid var(--line); border-bottom-right-radius: 4px; align-self: flex-end; }
    .step::before { content: '0' counter(s); position: static; inset: auto; opacity: 1 !important; display: block; font: 800 44px/1 var(--mono); background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 16px; }

    /* marquee */
    .marquee { margin-top: 56px; overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
    .track { display: flex; gap: 14px; width: max-content; animation: scroll 36s linear infinite; }
    .marquee:hover .track { animation-play-state: paused; }
    .chip { padding: 12px 22px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font: 600 14px var(--mono); color: var(--muted); }
    @keyframes scroll { to { transform: translateX(-50%); } }

    /* compare */
    .tbl { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; font-size: 15px; }
    .tbl th, .tbl td { padding: 16px 20px; text-align: left; border-bottom: 1px solid var(--line); }
    .tbl tr:last-child td { border-bottom: 0; }
    .tbl th { font-size: 13px; color: var(--dim); font-weight: 700; background: var(--surface-2); }
    .tbl .mk { vertical-align: -2px; margin-right: 6px; }
    .tbl th.us, .tbl td.us { background: color-mix(in srgb, var(--violet) 12%, var(--surface)); font-weight: 700; }
    .tbl .mk { vertical-align: -2px; margin-right: 6px; }
    .tbl th.us { color: var(--violet-2); }
    .y { color: var(--ok); } .n { color: var(--bad); } .p { color: var(--amber); }

    /* faq */
    .faq { max-width: 800px; margin: 0 auto; display: grid; gap: 12px; }
    .faq details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; transition: border-color .2s; }
    .faq details[open] { border-color: color-mix(in srgb, var(--violet) 55%, var(--line)); }
    .faq summary { list-style: none; cursor: pointer; padding: 20px 24px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .faq summary::-webkit-details-marker { display: none; }
    .faq summary::after { content: '+'; font: 400 26px/1 var(--mono); color: var(--violet-2); transition: transform .25s; }
    .faq details[open] summary::after { transform: rotate(45deg); }
    .faq .a { padding: 0 24px 22px; color: var(--muted); }

    /* final */

      en: { head: ['', 'Voicemail / IVR', 'Call center', 'Allo AI'], rows: [
        ['Answers the call', ['n', 'Menus and waiting'], ['p', 'Business hours'], ['y', 'Instantly, 24/7']],
        ['Live dialogue & interruption', ['n', 'No'], ['y', 'Yes'], ['y', 'Yes']],
        ['Scale at peak', ['p', 'Limited by lines'], ['n', 'Requires hiring'], ['y', 'Up to 1,000 lines']],
        ['Summary in CRM', ['n', 'Manual'], ['p', 'Depends on the person'], ['y', 'Automatic']],
        ['Timezone-aware outbound', ['n', 'No'], ['p', 'Manual'], ['y', 'Automatic']]
      ] }
    };

    var lang = 'uk', caseIdx = 0;

    function renderDialog(list) {
      return list.map(function (m) {
        return '<div class="msg ' + m[0] + '"><b>' + (m[0] === 'ai' ? 'Allo AI' : (lang === 'uk' ? 'Клієнт' : 'Customer')) + '</b>' + m[1] + '</div>';
      }).join('');
    }
    function renderCases() {
      var cs = CASES[lang], c = cs[caseIdx];
      $('#tabs').innerHTML = cs.map(function (x, i) {
        return '<button class="tab" type="button" role="tab" aria-selected="' + (i === caseIdx) + '" data-i="' + i + '">' + x.tab + '</button>';
      }).join('');
      $$('#tabs .tab').forEach(function (b) { b.onclick = function () { caseIdx = +b.dataset.i; renderCases(); }; });
      $('#case').innerHTML = '<div class="case"><div><h3>' + c.title + '</h3><p>' + c.desc + '</p><ul class="checks">' +
        c.bullets.map(function (b) { return '<li>' + CHECK + '<span>' + b + '</span></li>'; }).join('') +
        '</ul></div><div class="dialog-box">' + renderDialog(c.dlg) + '</div></div>';
    }
    function renderFaq() {
      $("#faq-list").innerHTML = FAQ[lang].map(function (q, i) {
        return '<details' + (i === 0 ? ' open' : '') + '><summary>' + q[0] + '</summary><div class="a">' + q[1] + '</div></details>';
      }).join('');
    }
    var MK = '<svg class="mk" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">';
    var MARK = { y: MK + '<path d="M20 6L9 17l-5-5"/></svg>', n: MK + '<path d="M6 6l12 12M18 6L6 18"/></svg>', p: MK + '<path d="M5 12h14"/></svg>' };
    function renderCmp() {
      var d = CMP[lang];
      $('#cmp').innerHTML = '<thead><tr>' + d.head.map(function (h, i) { return '<th' + (i === 3 ? ' class="us"' : '') + '>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
        d.rows.map(function (r) {
          return '<tr><td>' + r[0] + '</td>' + r.slice(1).map(function (c, i) {
            return '<td data-label="' + d.head[i + 1] + '" class="' + (i === 2 ? 'us ' : '') + c[0] + '">' + MARK[c[0]] + '<span style="color:var(--text)">' + c[1] + '</span></td>';
          }).join('') + '</tr>';
        }).join('') + '</tbody>';
    }
    function applyLang(l) {
      lang = l; document.documentElement.lang = l;
      var d = T[l];
      $$('[data-i]').forEach(function (el) { if (d[el.dataset.i] !== undefined) el.textContent = d[el.dataset.i]; });
      $$('[data-ip]').forEach(function (el) { el.placeholder = d[el.dataset.ip]; });
      $$('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === l)); });
      renderCases(); renderFaq(); renderCmp(); calcRoi(); restartDemo();
    }
    /* language and theme switches live in site.js; it announces language changes */
    document.addEventListener('allo:lang', function (e) { applyLang(e.detail); });

    /* header + sticky cta */
    window.addEventListener('scroll', function () {
      $('#hdr').classList.toggle('scrolled', scrollY > 8);
      $('#sticky').classList.toggle('show', scrollY > 520 && !modal.classList.contains('open') && document.querySelector('footer.site').getBoundingClientRect().top > innerHeight);
    }, { passive: true });

    /* reveal + counters */
    function countUp(el) {
      var to = +el.dataset.count, fmt = el.dataset.fmt, t0 = performance.now();
      function f(n) { return fmt ? n.toLocaleString(lang === 'uk' ? 'uk-UA' : 'en-US') : String(n); }
      if (REDUCED) { el.textContent = f(to); return; }
      (function tick(now) {
        var p = Math.min(1, (now - t0) / 1400), e = 1 - Math.pow(1 - p, 3);
        el.textContent = f(Math.round(to * e));
        if (p < 1) requestAnimationFrame(tick);
      })(t0);
    }
    var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.classList.add('in');
        $$('[data-count]').forEach(function (c) { if (e.target.contains(c) && !c.dataset.done) { c.dataset.done = 1; countUp(c); } });
        io.unobserve(e.target);
      });
    }, { threshold: .15 }) : null;
    $$('.rv').forEach(function (el) { io ? io.observe(el) : el.classList.add('in'); });
    if (!io) $$('[data-count]').forEach(countUp);

    /* spotlight on cards */
    document.addEventListener('pointermove', function (e) {
      var c = e.target.closest && e.target.closest('.card');
      if (!c) return;
      var r = c.getBoundingClientRect();
      c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });

    /* feature bars + integrations marquee */
    $('#bars').innerHTML = Array.apply(null, Array(28)).map(function (_, i) {
      return '<i style="animation-delay:-' + ((i * 0.37) % 1.6).toFixed(2) + 's;animation-duration:' + (1.1 + (i % 5) * 0.2).toFixed(1) + 's"></i>';
    }).join('');
    var INTEG = ['Binotel', 'Ringostat', 'UniTalk', 'Kyivstar', 'KeyCRM', 'HubSpot', 'Zoho', 'Asterisk', 'Webhooks', 'SIP'];
    $('#track').innerHTML = INTEG.concat(INTEG).map(function (n) { return '<span class="chip">' + n + '</span>'; }).join('');

    /* ROI calculator */
    function money(n) { return T[lang].currency + Math.round(n).toLocaleString(lang === 'uk' ? 'uk-UA' : 'en-US'); }
    function calcRoi() {
      var c = +$('#r-calls').value, m = +$('#r-miss').value, d = +$('#r-deal').value;
      var leads = c * (m / 100) * 0.25 * 0.2;
      $('#o-calls').textContent = c.toLocaleString(); $('#o-miss').textContent = m + '%'; $('#o-deal').textContent = money(d);
      $('#roi-total').textContent = money(leads * d); $('#roi-leads').textContent = Math.round(leads);
      ['calls', 'miss', 'deal'].forEach(function (k) {
        var r = $('#r-' + k); r.style.setProperty('--p', ((r.value - r.min) / (r.max - r.min) * 100) + '%');
      });
    }
    ['#r-calls', '#r-miss', '#r-deal'].forEach(function (s) { $(s).addEventListener('input', calcRoi); });

    /* hero live-call demo */
    var meter = $('#meter'), tr = $('#tr'), N = 52, bars = [], speaking = null, lvl = 0, demoRun = 0, secs = 0, timerId = 0;
    meter.innerHTML = Array(N + 1).join('<span></span>'); bars = $$('#meter span');
    (function loop(t) {
      lvl += ((speaking ? 1 : 0) - lvl) * .18;
      bars.forEach(function (b, i) {
        var env = Math.sin(i / N * Math.PI);
        var v = (Math.sin(t / 120 + i * .8) + Math.sin(t / 61 + i * 1.7) + 2) / 4;
        b.style.height = (6 + lvl * env * v * 92) + '%';
      });
      if (!REDUCED) requestAnimationFrame(loop);
    })(0);
    function setSpeaker(s) {
      speaking = s; meter.className = 'meter' + (s ? ' ' + s : '');
      $('#speaker').className = 'speaker' + (s ? ' ' + s : '');
      var d = T[lang]; $('#sp-name').textContent = s === 'agent' ? d.spk_ai : s === 'caller' ? d.spk_cl : d.spk_idle;
    }
    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function fmt2(n) { return (n < 10 ? '0' : '') + n; }
    function ev(n) { var e = $$('#events .ev')[n - 1]; if (e) e.classList.add('done'); }
    async function typeLine(who, text, id) {
      $$('#tr .ln').forEach(function (l) { l.classList.add('old'); });
      var ln = document.createElement('div'); ln.className = 'ln ' + who;
      var words = text.split(' ');
      ln.innerHTML = '<b>' + (who === 'ai' ? 'Allo AI' : (lang === 'uk' ? 'Клієнт' : 'Customer')) + '</b><p>' +
        words.map(function (w) { return '<span class="w">' + w + '</span>'; }).join(' ') + '</p>';
      tr.appendChild(ln);
      var ws = $$('#tr .ln:last-child .w');
      for (var i = 0; i < ws.length; i++) {
        if (id !== demoRun) return false;
        ws[i].classList.add('on');
        if (!REDUCED) await sleep(who === "ai" ? 170 : 150);
      }
      return true;
    }
    async function runDemo() {
      var id = ++demoRun, lines = CASES[lang][0].dlg;
      tr.innerHTML = ''; $$('#events .ev').forEach(function (e) { e.classList.remove('done'); });
      setSpeaker(null); secs = 0; $('#timer').textContent = '00:00';
      clearInterval(timerId); timerId = setInterval(function () { secs++; $('#timer').textContent = fmt2(Math.floor(secs / 60)) + ':' + fmt2(secs % 60); }, 1000);
      await sleep(REDUCED ? 0 : 900);
      for (var i = 0; i < lines.length; i++) {
        if (id !== demoRun) return;
        var who = lines[i][0];
        if (who === 'ai') $('#lat').textContent = 226 + Math.floor(Math.random() * 28);
        setSpeaker(who === 'ai' ? 'agent' : 'caller');
        if (!(await typeLine(who, lines[i][1], id))) return;
        setSpeaker(null);
        if (i === 1) ev(1);
        if (i === 2) ev(2);
        await sleep(REDUCED ? 0 : 650);
      }
      if (id !== demoRun) return;
      await sleep(REDUCED ? 0 : 500); ev(3); clearInterval(timerId);
      await sleep(REDUCED ? 1e9 : 5200);
      if (id === demoRun) runDemo();
    }
    function restartDemo() { runDemo(); }

    /* modal */
    var modal = $('#modal'), lastFocus = null;
    function openModal() { lastFocus = document.activeElement; modal.classList.add('open'); document.body.classList.add('modal-open'); $('#sticky').classList.remove('show'); setTimeout(function () { $('#f-name').focus(); }, 30); }
    function closeModal() { modal.classList.remove('open'); document.body.classList.remove('modal-open'); if (lastFocus) lastFocus.focus(); }
    $$('.cta').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); openModal(); }); });
    $('#m-close').onclick = closeModal;
    modal.addEventListener('mousedown', function (e) { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', function (e) {
      if (!modal.classList.contains('open')) return;
      if (e.key === 'Escape') return closeModal();
      if (e.key === 'Tab') {
        var f = $$('#modal button, #modal input, #modal a'); var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    $('#form').addEventListener('submit', function (e) {
      e.preventDefault();
      var name = $('#f-name').value.trim(), contact = $('#f-contact').value.trim(), msg = $('#f-msg').value.trim();
      var st = $('#f-status'), btn = $('#f-btn'), d = T[lang];
      if (!name || contact.length < 3) { st.style.color = 'var(--bad)'; st.textContent = d.err_req; return; }
      btn.disabled = true; btn.textContent = d.sending; st.textContent = '';
      fetch(LEAD_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name, contact: contact, message: msg, lang: lang }) })
        .then(function (r) {
          if (!r.ok) throw new Error(r.status);
          st.style.color = 'var(--ok)'; st.textContent = d.ok; $('#form').reset();
        })
        .catch(function () { st.style.color = 'var(--bad)'; st.textContent = d.fail; })
        .then(function () { btn.disabled = false; btn.textContent = d.m_submit; });
    });
    $('#btn-tg').onclick = function () { window.open('https://t.me/+' + MANAGER_PHONE, '_blank', 'noopener'); };
    $('#btn-wa').onclick = function () { window.open('https://wa.me/' + MANAGER_PHONE, '_blank', 'noopener'); };

    applyLang(window.AlloSite.lang);
  </script>
</body>
</html>
