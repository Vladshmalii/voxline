<!doctype html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Сторінку не знайдено | Allo AI</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@700&display=swap">
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #050711; color: #f8fafc; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
    .box { max-width: 520px; background: #0a0f26; border: 1.5px solid #1e264f; border-radius: 28px; padding: 48px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
    .code { font-family: 'IBM Plex Mono', monospace; font-size: 80px; font-weight: 800; color: #00f2fe; margin-bottom: 12px; }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 16px; }
    p { color: #94a3b8; font-size: 16px; margin-bottom: 32px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 28px; border-radius: 12px; background: linear-gradient(135deg, #7928ca, #00f2fe); color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Сторінку не знайдено</h1>
    <p>Схоже, цей номер не відповідає або посилання застаріло.</p>

  </div>

</html>
