name: docker-publish
description: Build an image and push it to GHCR as :latest and :sha-<full commit sha>

inputs:
  image:
    description: Image name under ghcr.io/<owner>/
    required: true
  context:
    description: Docker build context
    required: true
  token:
    description: Token with packages:write
    required: true

runs:
  using: composite
  steps:
    - id: name
      shell: bash
      run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image }}" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        push: true
        tags: |
          ${{ steps.name.outputs.ref }}:latest
          ${{ steps.name.outputs.ref }}:sha-${{ github.sha }}
        cache-from: type=gha,scope=${{ inputs.image }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image }}
